<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Scripts de terceiros carregados com segurança externa -->
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Jogo do Número Secreto</title>
</head>

<body>

    <!-- BOAS PRÁTICAS: Trocado de <div> para <main> para melhorar a semântica da página -->
    <main class="container">
        <div class="container__conteudo">
            <div class="container__informacoes">
                <div class="container__texto">
                    <!-- CORREÇÃO: Padronização ortográfica do acento de "número" -->
                    <h1>Adivinhe meu <span class="container__texto-azul">número secreto</span></h1>
                    <p class="texto__paragrafo">Escolha um número entre 1 a 10.</p>
                </div>
                
                <!-- ACESSIBILIDADE: Adicionado 'aria-label' para leitores de tela entenderem o campo de digitação -->
                <input type="number" min="1" max="10" class="container__input" aria-label="Digite seu chute aqui">
                
                <div class="chute container__botoes">
                    <button onclick="verificarChute()" class="container__botao">Chutar</button>
                    <button onclick="reiniciarJogo()" id="reiniciar" class="container__botao" disabled>Novo jogo</button>
                </div>
            </div>
            <img src="./img/ia.png" alt="Desenho de uma pessoa olhando para a esquerda refletindo" class="container__imagem-pessoa" />
        </div>
    </main>

    <!-- O uso do 'defer' garante que o script rode apenas após o HTML estar todo desenhado -->
    <script src="app.js" defer></script>
</body>

</html>
